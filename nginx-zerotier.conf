# Private ZeroTier preview for pingpongdastrada.it.
# When the public domain is connected, add a dedicated 80/443 virtual host.
server {
    listen 10.51.216.141:8094;
    server_name 10.51.216.141;

    root /var/www/pingpongdastrada.it;
    index index.html;
    charset utf-8;

    # Keep this preview private to the ZeroTier subnet.
    allow 10.51.216.0/24;
    deny all;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    access_log /var/log/nginx/pingpongdastrada.access.log;
    error_log /var/log/nginx/pingpongdastrada.error.log;
}
